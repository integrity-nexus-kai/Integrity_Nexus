name: One-time artifact cleanup

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete all stored Actions artifacts
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          while true; do
            RESPONSE=$(curl -fsSL               -H "Authorization: Bearer $TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPO/actions/artifacts?per_page=100&page=1")

            IDS=$(printf '%s' "$RESPONSE" | python -c               'import sys,json; print("\n".join(str(x["id"]) for x in json.load(sys.stdin)["artifacts"]))')

            if [ -z "$IDS" ]; then
              echo "No artifacts remain."
              break
            fi

            while IFS= read -r ID; do
              curl -fsSL -X DELETE                 -H "Authorization: Bearer $TOKEN"                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "https://api.github.com/repos/$REPO/actions/artifacts/$ID"
              echo "Deleted artifact $ID"
            done <<< "$IDS"
          done
